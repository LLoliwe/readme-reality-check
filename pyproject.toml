[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-reality-check"
version = "0.1.0"
description = "Offline lint for broken README links, anchors, and quickstart scripts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pryntor Open Source"}]
keywords = ["readme", "documentation", "static-analysis", "ci"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
readme-reality = "readme_reality.cli:main"

[tool.setuptools.packages.find]
include = ["readme_reality*"]

